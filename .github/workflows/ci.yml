name: ModelSentry CI/CD

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image name (lowercase)
        id: vars
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY}"
          echo "image=${IMAGE,,}" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.vars.outputs.image }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push standard image
        id: build-standard
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: production
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

      - name: Pull built image for optimization
        run: |
          IMAGE_WITH_SHA=$(echo "${{ steps.meta.outputs.tags }}" | grep 'sha-' | head -n1)
          echo "IMAGE_TAG=${IMAGE_WITH_SHA}" >> $GITHUB_ENV
          docker pull "${IMAGE_WITH_SHA}"

      - name: Optimize with SlimToolkit
        run: |
          echo "🔧 Pulling SlimToolkit..."
          docker pull dslim/slim

          echo "⚡ Starting SlimToolkit optimization..."
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            dslim/slim build \
            --target "${{ env.IMAGE_TAG }}" \
            --tag "${{ steps.vars.outputs.image }}:slim" \
            --include-shell \
            --include-cert-all \
            --include-path /app \
            --include-path /etc/ssl \
            --include-path /usr/share/ca-certificates \
            --include-path /etc/ca-certificates \
            --include-workdir \
            --http-probe \
            --http-probe-retry-count 5 \
            --http-probe-retry-wait 10 \
            --http-probe-ports 3000 \
            --continue-after 30

          echo "✅ SlimToolkit optimization completed"

      - name: Tag and push optimized images
        run: |
          SLIM_IMAGE="${{ steps.vars.outputs.image }}:slim"
          TIMESTAMP_TAG="${{ steps.vars.outputs.image }}:slim-$(date -u +%Y%m%d-%H%M%S)"

          echo "🏷️  Tagging optimized images..."
          docker tag "${SLIM_IMAGE}" "${TIMESTAMP_TAG}"

          echo "📤 Pushing optimized images..."
          docker push "${SLIM_IMAGE}"
          docker push "${TIMESTAMP_TAG}"

          echo "✅ All optimized images pushed successfully"

      - name: Display image size comparison
        run: |
          echo "📊 Image Size Comparison"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          STANDARD_SIZE=$(docker images "${{ env.IMAGE_TAG }}" --format "{{.Size}}" 2>/dev/null | head -n1)
          SLIM_SIZE=$(docker images "${{ steps.vars.outputs.image }}:slim" --format "{{.Size}}" 2>/dev/null | head -n1)

          if [[ -n "$STANDARD_SIZE" && -n "$SLIM_SIZE" ]]; then
            echo "📦 Standard image: $STANDARD_SIZE"
            echo "⚡ Optimized image: $SLIM_SIZE"
            echo ""
            echo "🎯 Available tags:"
            echo "${{ steps.meta.outputs.tags }}" | while read tag; do
              echo "  • $tag"
            done
            echo "  • ${{ steps.vars.outputs.image }}:slim"
          else
            echo "⚠️  Could not retrieve image sizes"
          fi

  validate-pr:
    name: Validate Pull Request
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Dockerfile
        run: |
          echo "🔍 Validating Dockerfile..."
          docker buildx build --dry-run . -f Dockerfile -t test:validation
          echo "✅ Dockerfile validation passed"

      - name: PR validation complete
        run: |
          echo "🎉 Pull request validation completed successfully"
          echo "📝 Changes are ready for review"
