services:
  modelsentry:
    image: ghcr.io/mgrsc/modelsentry
    container_name: modelsentry
    ports:
      - "3000:3000"
    environment:
      - TZ=Asia/Shanghai
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
